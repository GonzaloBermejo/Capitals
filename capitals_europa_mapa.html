<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les capitals d'Europa · 1r d'ESO</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#233047;background:#f4f3ee}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;margin:auto;padding:22px}header{text-align:center;margin-bottom:20px}h1{font-size:clamp(28px,4vw,43px);margin:4px}header p{color:#667085;margin:6px}.card{background:white;border:1px solid #dce1e8;border-radius:19px;padding:25px;box-shadow:0 5px 20px #2330470b}.hidden{display:none!important}.setup{max-width:750px;margin:auto}h2{margin:0 0 17px;font-size:23px}label{display:block;font-weight:700;margin:17px 0 8px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.choice{padding:16px;border:2px solid #dce1e8;background:#fff;border-radius:13px;text-align:left;cursor:pointer;color:#233047;font:inherit}.choice b{display:block;font-size:17px;margin-bottom:5px}.choice small{color:#667085;line-height:1.4}.choice.selected{border-color:#356ac4;background:#eaf1ff}select,input{width:100%;font:inherit;font-size:18px;padding:13px;border:2px solid #dce1e8;border-radius:11px;background:white;color:#233047}button{font:inherit}.primary{border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:17px;color:white;background:#356ac4;cursor:pointer}.primary:hover{background:#26529c}.primary:disabled{opacity:.5}.secondary{border:1px solid #dce1e8;background:white;border-radius:12px;padding:13px 19px;cursor:pointer}.full{width:100%;margin-top:22px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:700}.progress{height:10px;background:#e8edf4;border-radius:10px;overflow:hidden;margin:14px 0 22px}.progress div{height:100%;background:#356ac4;width:0;transition:width .25s}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:24px;align-items:start}.mapbox{border-radius:14px;overflow:hidden;border:1px solid #dce1e8;position:relative}#map{height:465px;background:#e7eef5}.mapnote{font-size:13px;color:#667085;margin:8px 0}.prompt{text-align:center;font-size:17px;color:#667085;margin:14px 0 5px}.country{text-align:center;font-size:clamp(29px,3.5vw,43px);font-weight:800;margin:0 0 23px;min-height:48px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{min-height:66px;padding:10px;border:2px solid #dce1e8;border-radius:12px;background:white;color:#233047;font-weight:650;font-size:18px;cursor:pointer}.answer:not(:disabled):hover{background:#eaf1ff;border-color:#356ac4}.answer.correct{background:#e4f5e9;border-color:#16784c;color:#16784c}.answer.incorrect{background:#ffebeb;border-color:#b93838;color:#b93838}.answer:disabled{cursor:default}.feedback{text-align:center;padding:14px;margin-top:20px;border-radius:12px;font-weight:700;font-size:18px}.good{background:#e4f5e9;color:#16784c}.bad{background:#ffebeb;color:#b93838}.actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}.results{text-align:center}.bigscore{font-size:70px;font-weight:800;color:#356ac4}.review{text-align:left;margin-top:24px}.review div{border-bottom:1px solid #e5e8ed;padding:11px}.review strong{display:block}.error{color:#b93838}.right{color:#16784c}.status{font-size:13px;color:#667085;text-align:center;padding:8px}.mapfallback{background:#fff4dd;color:#755200;padding:10px;font-size:14px}.leaflet-container{font-family:inherit}@media(max-width:800px){.layout{grid-template-columns:1fr}#map{height:350px}.card{padding:17px}}@media(max-width:480px){.answers{grid-template-columns:1fr}main{padding:12px}.answer{min-height:55px}}
</style></head><body><main><header><div style="font-size:40px">🌍</div><h1>Les capitals d'Europa</h1><p>Geografia · 1r d'ESO</p></header>
<section id="start" class="card setup"><h2>Prepara la partida</h2><label>1. Com vols respondre?</label><div class="choices" id="answerModes"><button class="choice selected" data-value="test"><b>🎯 Tipus test</b><small>Tria entre quatre capitals.</small></button><button class="choice" data-value="write"><b>✏️ Escriure</b><small>Escriu la capital sense opcions.</small></button></div><label>2. Com vols utilitzar el mapa?</label><div class="choices" id="mapModes"><button class="choice" data-value="none"><b>Sense mapa</b><small>Només veuràs el nom del país.</small></button><button class="choice selected" data-value="help"><b>Mapa amb ajuda</b><small>País destacat i nom visible.</small></button><button class="choice" data-value="blind"><b>Mapa sense pistes</b><small>Només el país destacat.</small></button></div><label for="amount">3. Nombre de preguntes</label><select id="amount"><option value="10">10 països</option><option value="20">20 països</option><option value="all">Tots els països disponibles</option></select><button id="startButton" class="primary full">Comença la partida →</button><p class="status">El mapa necessita connexió a Internet. Les preguntes funcionen sense mapa.</p></section>
<section id="game" class="card hidden"><div class="top"><span id="counter"></span><span id="score"></span></div><div class="progress"><div id="bar"></div></div><div class="layout"><div id="mapColumn"><div class="mapbox"><div id="map"></div><div id="mapError" class="mapfallback hidden"></div></div><p class="mapnote">Pots fer zoom i desplaçar el mapa. El país de la pregunta apareix en blau.</p></div><div><p class="prompt" id="prompt">Quina és la capital de...?</p><div class="country" id="country"></div><div id="answers" class="answers"></div><form id="writeForm" class="hidden"><input id="written" placeholder="Escriu la capital..." autocomplete="off" spellcheck="false" aria-label="Capital"><button id="check" class="primary full">Comprova la resposta</button></form><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="next" class="primary hidden">Pregunta següent →</button></div></div></div></section>
<section id="end" class="card results hidden"><h2>🏆 Partida acabada!</h2><div id="finalScore" class="bigscore"></div><p id="finalText"></p><p id="message"></p><div class="actions"><button id="again" class="primary">Torna a jugar</button><button id="home" class="secondary">Canvia les opcions</button></div><div id="review" class="review"></div></section></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
// ISO 3166-1 alfa-3. La selecció inclou estats transcontinentals i Kosovo.
const data=[
['Albània','Tirana','ALB'],['Alemanya','Berlín','DEU'],['Andorra','Andorra la Vella','AND'],['Armènia','Erevan','ARM'],['Àustria','Viena','AUT'],['Azerbaidjan','Bakú','AZE'],['Bèlgica','Brussel·les','BEL'],['Belarús','Minsk','BLR'],['Bòsnia i Hercegovina','Sarajevo','BIH'],['Bulgària','Sofia','BGR'],['Croàcia','Zagreb','HRV'],['Dinamarca','Copenhaguen','DNK'],['Eslovàquia','Bratislava','SVK'],['Eslovènia','Ljubljana','SVN'],['Espanya','Madrid','ESP'],['Estònia','Tallinn','EST'],['Finlàndia','Hèlsinki','FIN'],['França','París','FRA'],['Geòrgia','Tbilisi','GEO'],['Grècia','Atenes','GRC'],['Hongria','Budapest','HUN'],['Irlanda','Dublín','IRL'],['Islàndia','Reykjavík','ISL'],['Itàlia','Roma','ITA'],['Kazakhstan','Astana','KAZ'],['Kosovo','Pristina','XKX'],['Letònia','Riga','LVA'],['Liechtenstein','Vaduz','LIE'],['Lituània','Vílnius','LTU'],['Luxemburg','Luxemburg','LUX'],['Macedònia del Nord','Skopje','MKD'],['Malta','La Valletta','MLT'],['Moldàvia','Chisinau','MDA'],['Mònaco','Mònaco','MCO'],['Montenegro','Podgorica','MNE'],['Noruega','Oslo','NOR'],['Països Baixos','Amsterdam','NLD'],['Polònia','Varsòvia','POL'],['Portugal','Lisboa','PRT'],['Regne Unit','Londres','GBR'],['República Txeca','Praga','CZE'],['Romania','Bucarest','ROU'],['Rússia','Moscou','RUS'],['San Marino','San Marino','SMR'],['Sèrbia','Belgrad','SRB'],['Suècia','Estocolm','SWE'],['Suïssa','Berna','CHE'],['Turquia','Ankara','TUR'],['Ucraïna','Kíiv','UKR'],['Vaticà','Ciutat del Vaticà','VAT'],['Xipre','Nicòsia','CYP']
].map(([country,capital,iso])=>({country,capital,iso}));
const aliases={DEU:['Berlin'],AZE:['Baku'],BEL:['Brusselles','Bruselas'],FIN:['Helsinki'],FRA:['Paris'],IRL:['Dublin'],ISL:['Reykjavik'],MLT:['Valletta','La Valeta'],MDA:['Chișinău','Chisinau','Kishinev'],POL:['Varsovia'],RUS:['Moscu','Moscú'],UKR:['Kyiv','Kiev'],VAT:['Vaticà','Vaticano','Ciudad del Vaticano'],GRC:['Atenas'],LUX:['Luxembourg'],MKD:['Skopie'],CZE:['Praha'],XKX:['Prishtina']};
const $=id=>document.getElementById(id);let answerMode='test',mapMode='help',questions=[],index=0,correct=0,wrong=0,answered=false,mistakes=[];let map=null,geo=null,highlight=null,mapReady=false,mapPromise=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selectGroup(group,callback){$(group).querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{callback(b.dataset.value);$(group).querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))}))}
selectGroup('answerModes',v=>answerMode=v);selectGroup('mapModes',v=>mapMode=v);
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function warnMap(message){$('mapError').textContent=message;$('mapError').classList.remove('hidden')}
async function prepareMap(){if(mapMode==='none')return;if(mapReady)return;if(mapPromise)return mapPromise;mapPromise=(async()=>{try{if(typeof L==='undefined')throw Error('No s’ha pogut carregar el visor del mapa.');map=L.map('map',{zoomControl:true,worldCopyJump:false,minZoom:2,maxZoom:9}).setView([54,17],4);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);const response=await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');if(!response.ok)throw Error('No s’han pogut carregar les fronteres.');const collection=await response.json();geo=L.geoJSON(collection,{style:{color:'#8192a4',weight:1,fillColor:'#d9e1e8',fillOpacity:.55},onEachFeature:(feature,layer)=>{const p=feature.properties||{};layer.countryCode=p['ISO3166-1-Alpha-3']||p.ISO_A3||p.ADM0_A3||p.iso_a3||''}}).addTo(map);mapReady=true;setTimeout(()=>{map.invalidateSize();paintCountry()},100)}catch(e){warnMap('No s’ha pogut carregar el mapa. Comprova la connexió. Pots continuar responent les preguntes.');console.error(e)}})();return mapPromise}
function paintCountry(){if(!mapReady||!geo||mapMode==='none'||!questions[index])return;if(highlight){highlight.setStyle({color:'#8192a4',weight:1,fillColor:'#d9e1e8',fillOpacity:.55});highlight=null}const iso=questions[index].iso;geo.eachLayer(layer=>{if(layer.countryCode===iso){highlight=layer;layer.setStyle({color:'#174e9d',weight:2.5,fillColor:'#3476d8',fillOpacity:.85});layer.bringToFront()}});if(highlight){const bounds=highlight.getBounds();if(bounds.isValid()){map.fitBounds(bounds.pad(.55),{maxZoom:iso==='RUS'||iso==='KAZ'?4:6,animate:false})}}else{warnMap('Aquest país no apareix a les fronteres del mapa. Pots continuar responent.')}}
function startGame(){let amount=$('amount').value;questions=shuffle(data).slice(0,amount==='all'?data.length:Number(amount));index=0;correct=wrong=0;mistakes=[];show('game');$('mapColumn').classList.toggle('hidden',mapMode==='none');render();if(mapMode!=='none')prepareMap().then(()=>{if(map)map.invalidateSize();paintCountry()})}
function render(){answered=false;const c=questions[index];$('counter').textContent=`Pregunta ${index+1} de ${questions.length}`;$('score').textContent=`✓ ${correct} · ✗ ${wrong}`;$('bar').style.width=`${index/questions.length*100}%`;$('country').textContent=mapMode==='blind'?'❓':c.country;$('prompt').textContent=mapMode==='blind'?'Quina és la capital del país destacat?':'Quina és la capital de...?';$('feedback').className='feedback hidden';$('next').classList.add('hidden');$('answers').classList.toggle('hidden',answerMode!=='test');$('writeForm').classList.toggle('hidden',answerMode!=='write');$('mapError').classList.add('hidden');if(answerMode==='test'){const alternatives=shuffle(data.filter(x=>x.capital!==c.capital)).slice(0,3).map(x=>x.capital);$('answers').replaceChildren();shuffle([c.capital,...alternatives]).forEach(capital=>{const b=document.createElement('button');b.className='answer';b.textContent=capital;b.onclick=()=>submitTest(capital);$('answers').append(b)})}else{$('written').value='';$('written').disabled=false;$('check').disabled=false;if(mapMode==='none')$('written').focus()}if(mapMode!=='none')paintCountry()}
function normalize(s){return s.toLocaleLowerCase('ca').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/·/g,'').replace(/[^a-z0-9]/g,'')}
function submitTest(value){if(answered)return;const c=questions[index];$('answers').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent===c.capital)b.classList.add('correct');else if(b.textContent===value)b.classList.add('incorrect')});finish(value===c.capital,value)}
$('writeForm').addEventListener('submit',e=>{e.preventDefault();if(answered)return;const value=$('written').value.trim();if(!value)return;const c=questions[index];const accepted=[c.capital,...(aliases[c.iso]||[])];$('written').disabled=true;$('check').disabled=true;finish(accepted.some(s=>normalize(s)===normalize(value)),value)});
function finish(ok,value){answered=true;const c=questions[index];if(ok){correct++;$('feedback').textContent='✓ Molt bé! Resposta correcta!';$('feedback').className='feedback good'}else{wrong++;mistakes.push({country:c.country,answer:value,capital:c.capital});$('feedback').textContent=`✗ ${c.country}: ${c.capital}`;$('feedback').className='feedback bad'}if(mapMode==='blind')$('country').textContent=c.country;$('score').textContent=`✓ ${correct} · ✗ ${wrong}`;$('bar').style.width=`${(index+1)/questions.length*100}%`;$('next').textContent=index===questions.length-1?'Mostra els resultats →':'Pregunta següent →';$('next').classList.remove('hidden');$('next').focus()}
$('next').onclick=()=>{if(!answered)return;index++;if(index<questions.length)render();else results()};function results(){show('end');const score=correct/questions.length*10;$('finalScore').textContent=`${score.toLocaleString('ca-ES',{maximumFractionDigits:1})} / 10`;$('finalText').textContent=`Has encertat ${correct} de ${questions.length} capitals.`;$('message').textContent=score===10?'Excel·lent! Les domines totes! 🌟':score>=8?'Molt bona feina! 👏':score>=5?'Continua practicant! 💪':'Amb pràctica milloraràs! 🌱';$('review').replaceChildren();if(mistakes.length){const h=document.createElement('h2');h.textContent='Capitals per repassar';$('review').append(h);mistakes.forEach(m=>{const d=document.createElement('div'),b=document.createElement('strong'),e=document.createElement('span'),r=document.createElement('span');b.textContent=m.country;e.textContent=`La teva resposta: ${m.answer}`;e.className='error';r.textContent=` · Correcta: ${m.capital}`;r.className='right';d.append(b,e,r);$('review').append(d)})}}$('startButton').onclick=startGame;$('again').onclick=startGame;$('home').onclick=()=>show('start');
</script></body></html>
