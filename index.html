const $=id=>document.getElementById(id);let answerMode='test',mapMode='help',questions=[],index=0,correct=0,wrong=0,answered=false,mistakes=[];let map=null,geo=null,highlight=null,mapReady=false,mapPromise=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selectGroup(group,callback){$(group).querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{callback(b.dataset.value);$(group).querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))}))}
selectGroup('answerModes',v=>answerMode=v);selectGroup('mapModes',v=>mapMode=v);
function show(id){['start','game','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function warnMap(message){$('mapError').textContent=message;$('mapError').classList.remove('hidden')}
async function prepareMap(){if(mapMode==='none')return;if(mapReady)return;if(mapPromise)return mapPromise;mapPromise=(async()=>{try{if(typeof L==='undefined')throw Error('No s’ha pogut carregar el visor del mapa.');map=L.map('map',{zoomControl:true,worldCopyJump:false,minZoom:2,maxZoom:9}).fitBounds(continentBounds[$('continent').value]);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);const response=await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');if(!response.ok)throw Error('No s’han pogut carregar les fronteres.');const collection=await response.json();geo=L.geoJSON(collection,{style:{color:'#8192a4',weight:1,fillColor:'#d9e1e8',fillOpacity:.55},onEachFeature:(feature,layer)=>{const p=feature.properties||{};layer.countryCode=p['ISO3166-1-Alpha-3']||p.ISO_A3||p.ADM0_A3||p.iso_a3||p.ISO_A3_EH||''}}).addTo(map);mapReady=true;setTimeout(()=>{map.invalidateSize();paintCountry()},100)}catch(e){warnMap(tr('mapFail'));console.error(e);mapPromise=null}})();return mapPromise}
function paintCountry(){if(mapReady&&map&&questions[index])map.fitBounds(continentBounds[$('continent').value],{animate:false});if(!mapReady||!geo||mapMode==='none'||!questions[index])return;if(highlight){highlight.setStyle({color:'#8192a4',weight:1,fillColor:'#d9e1e8',fillOpacity:.55});highlight=null}const iso=questions[index].iso;geo.eachLayer(layer=>{if(layer.countryCode===iso || (iso==='XKX' && ['KOS','XKX'].includes(layer.countryCode))){highlight=layer;layer.setStyle({color:'#174e9d',weight:2.5,fillColor:'#3476d8',fillOpacity:.85});layer.bringToFront()}});if(highlight){$('mapError').classList.add('hidden');const bounds=highlight.getBounds();if(bounds.isValid()){map.fitBounds(bounds.pad(.55),{maxZoom:['RUS','KAZ','CAN','USA','CHN','AUS','BRA'].includes(iso)?4:6,animate:false})}}else{warnMap(tr('highlightFail'))}}
function startGame(){let amount=$('amount').value;const pool=allCountries.filter(c=>c.continent===$('continent').value);questions=shuffle(pool).slice(0,amount==='all'?pool.length:Number(amount));index=0;correct=wrong=0;mistakes=[];show('game');$('mapColumn').classList.toggle('hidden',mapMode==='none');render();if(mapMode!=='none')prepareMap().then(()=>{if(map)map.invalidateSize();paintCountry()})}
function render(){answered=false;const c=questions[index];$('counter').textContent=`${tr('question')} ${index+1} ${tr('of')} ${questions.length}`;$('score').textContent=`✓ ${correct} · ✗ ${wrong}`;$('bar').style.width=`${index/questions.length*100}%`;$('country').textContent=mapMode==='blind'?'❓':displayCountry(c);$('prompt').textContent=mapMode==='blind'?tr('blindPrompt'):tr('prompt');$('feedback').className='feedback hidden';$('next').classList.add('hidden');$('answers').classList.toggle('hidden',answerMode!=='test');$('writeForm').classList.toggle('hidden',answerMode!=='write');$('mapError').classList.add('hidden');if(answerMode==='test'){const alternatives=shuffle(allCountries.filter(x=>x.continent===c.continent&&x.iso!==c.iso)).slice(0,3).map(x=>displayCapital(x));$('answers').replaceChildren();shuffle([displayCapital(c),...alternatives]).forEach(capital=>{const b=document.createElement('button');b.className='answer';b.textContent=capital;b.onclick=()=>submitTest(capital);$('answers').append(b)})}else{$('written').value='';$('written').disabled=false;$('check').disabled=false;if(mapMode==='none')$('written').focus()}if(mapMode!=='none')paintCountry()}
function normalize(s){return s.toLocaleLowerCase('ca').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/·/g,'').replace(/[^a-z0-9]/g,'')}
function submitTest(value){if(answered)return;const c=questions[index];$('answers').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent===displayCapital(c))b.classList.add('correct');else if(b.textContent===value)b.classList.add('incorrect')});finish(value===displayCapital(c),value)}
$('writeForm').addEventListener('submit',e=>{e.preventDefault();if(answered)return;const value=$('written').value.trim();if(!value)return;const c=questions[index];const accepted=[c.capital,displayCapital(c),...(aliases[c.iso]||[]),...Object.values(capitalTranslations).map(t=>t[c.iso]).filter(Boolean)];$('written').disabled=true;$('check').disabled=true;finish(accepted.some(s=>normalize(s)===normalize(value)),value)});
function finish(ok,value){answered=true;const c=questions[index];if(ok){correct++;$('feedback').textContent=tr('correct');$('feedback').className='feedback good'}else{wrong++;mistakes.push({country:displayCountry(c),answer:value,capital:displayCapital(c)});$('feedback').textContent=`${tr('wrong')} ${displayCountry(c)}: ${displayCapital(c)}`;$('feedback').className='feedback bad'}if(mapMode==='blind')$('country').textContent=displayCountry(c);$('score').textContent=`✓ ${correct} · ✗ ${wrong}`;$('bar').style.width=`${(index+1)/questions.length*100}%`;$('next').textContent=index===questions.length-1?tr('show'):tr('next');$('next').classList.remove('hidden');$('next').focus()}
$('next').onclick=()=>{if(!answered)return;index++;if(index<questions.length)render();else results()};function results(){show('end');const score=correct/questions.length*10;$('finalScore').textContent=`${score.toLocaleString('ca-ES',{maximumFractionDigits:1})} / 10`;$('finalText').textContent=tr('result').replace('{n}',correct).replace('{total}',questions.length);$('message').textContent=score===10?tr('perfect'):score>=8?tr('great'):score>=5?tr('medium'):tr('low');$('review').replaceChildren();if(mistakes.length){const h=document.createElement('h2');h.textContent=tr('review');$('review').append(h);mistakes.forEach(m=>{const d=document.createElement('div'),b=document.createElement('strong'),e=document.createElement('span'),r=document.createElement('span');b.textContent=m.country;e.textContent=`${tr("your")} ${m.answer}`;e.className='error';r.textContent= ` · ${tr("right")} ${m.capital}`;r.className='right';d.append(b,e,r);$('review').append(d)})}}$('startButton').onclick=startGame;$('again').onclick=startGame;$('home').onclick=()=>show('start');
